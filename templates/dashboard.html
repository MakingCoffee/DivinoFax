<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 DivinoFax Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .status-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .status-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .status-indicator {
            font-size: 3em;
            margin-bottom: 10px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-text {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-start {
            background-color: #4CAF50;
        }

        .btn-start:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-stop {
            background-color: #f44336;
        }

        .btn-stop:hover {
            background-color: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        .btn-restart {
            background-color: #2196F3;
        }

        .btn-restart:hover {
            background-color: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
        }

        .stat-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .stat-content {
            color: #555;
            line-height: 1.8;
            font-family: monospace;
            font-size: 0.95em;
        }

        .fortunes-section {
            margin-top: 30px;
            border-top: 2px solid #e0e0e0;
            padding-top: 20px;
        }

        .fortunes-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .fortune-item {
            background: #f9f9f9;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .fortune-card {
            font-weight: bold;
            color: #667eea;
        }

        .fortune-time {
            font-size: 0.85em;
            color: #999;
            margin-top: 5px;
        }

        .no-fortunes {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .loading {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .settings-section {
            margin-top: 30px;
            border-top: 2px solid #e0e0e0;
            padding-top: 20px;
        }

        .settings-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .settings-card {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
        }

        .settings-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: monospace;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .network-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .network-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .network-item:hover {
            background-color: #e8e8f8;
        }

        .network-item:last-child {
            border-bottom: none;
        }

        .network-name {
            font-weight: bold;
            color: #333;
        }

        .network-security {
            font-size: 0.85em;
            color: #999;
            margin-top: 3px;
        }

        .btn-settings {
            background-color: #667eea;
            width: 100%;
            margin-top: 10px;
        }

        .btn-settings:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .badge-connected {
            background-color: #4CAF50;
            color: white;
        }

        .badge-disconnected {
            background-color: #f44336;
            color: white;
        }

        .badge-configured {
            background-color: #2196F3;
            color: white;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 600px) {
            .status-section,
            .stats-grid,
            .controls,
            .settings-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔮 DivinoFax Control</h1>
            <p>Oracle Fortune Telling System</p>
        </div>

        <div class="status-section">
            <div class="status-card">
                <div class="status-indicator" id="statusIcon">⏳</div>
                <div class="status-text" id="statusText">Loading...</div>
                <div class="controls">
                    <button class="btn-start" onclick="startSystem()">▶ Start</button>
                    <button class="btn-stop" onclick="stopSystem()">⏹ Stop</button>
                    <button class="btn-restart" onclick="restartSystem()">🔄 Restart</button>
                </div>
            </div>

            <div class="status-card">
                <h3 style="margin-bottom: 15px; color: #333;">Last Updated</h3>
                <div id="lastUpdate" style="font-size: 0.9em; color: #666; line-height: 1.6;">
                    <div>Loading...</div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-title">💾 Memory</div>
                <div class="stat-content" id="memoryStats">
                    Loading...
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-title">📁 Storage</div>
                <div class="stat-content" id="diskStats">
                    Loading...
                </div>
            </div>
        </div>

        <div class="fortunes-section">
            <div class="fortunes-title">📜 Recent Fortunes</div>
            <div id="fortunesList" class="loading">Loading...</div>
        </div>

        <div class="settings-section">
            <div class="settings-title">⚙️ Configuration</div>
            <div class="settings-grid">
                <!-- WiFi Configuration -->
                <div class="settings-card">
                    <h3>📡 WiFi Connection</h3>
                    <div id="wifiStatus" style="margin-bottom: 15px;">
                        <span class="status-badge badge-disconnected">Checking...</span>
                    </div>

                    <div class="input-group">
                        <label for="wifiSSID">Network Name (SSID)</label>
                        <input type="text" id="wifiSSID" placeholder="Enter network name or select below">
                    </div>

                    <div class="input-group">
                        <label>Available Networks</label>
                        <div id="networkList" class="network-list">
                            <div style="padding: 10px; text-align: center; color: #999;">Scanning...</div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="wifiPassword">Password</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="password" id="wifiPassword" placeholder="Enter WiFi password" style="flex: 1;">
                            <button style="padding: 10px 15px; background-color: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;" onclick="togglePasswordVisibility()">👁️</button>
                        </div>
                    </div>

                    <button class="btn-settings" onclick="connectWiFi()">🔗 Connect</button>
                    <div id="wifiMessage"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Refresh status every 5 seconds
        setInterval(updateStatus, 5000);
        updateStatus(); // Initial load

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                // Update status
                const statusIcon = document.getElementById('statusIcon');
                const statusText = document.getElementById('statusText');

                if (data.running) {
                    statusIcon.textContent = '🟢';
                    statusText.textContent = 'System Running';
                    statusText.style.color = '#4CAF50';
                } else {
                    statusIcon.textContent = '🔴';
                    statusText.textContent = 'System Stopped';
                    statusText.style.color = '#f44336';
                }

                // Update timestamp
                const lastUpdate = document.getElementById('lastUpdate');
                const date = new Date(data.timestamp);
                lastUpdate.innerHTML = `
                    <div>Status: ${data.status}</div>
                    <div style="font-size: 0.9em; margin-top: 5px;">Updated: ${date.toLocaleTimeString()}</div>
                `;

                // Update stats
                const memoryStats = document.getElementById('memoryStats');
                memoryStats.innerHTML = `
                    Total: ${data.stats.memory.total}<br>
                    Used: ${data.stats.memory.used}<br>
                    Free: ${data.stats.memory.free}
                `;

                const diskStats = document.getElementById('diskStats');
                diskStats.innerHTML = `
                    Total: ${data.stats.disk.total}<br>
                    Used: ${data.stats.disk.used}<br>
                    Free: ${data.stats.disk.free}
                `;

                // Update fortunes
                const fortunesList = document.getElementById('fortunesList');
                if (data.recent_fortunes && data.recent_fortunes.length > 0) {
                    fortunesList.innerHTML = data.recent_fortunes.map(fortune => `
                        <div class="fortune-item">
                            <div class="fortune-card">🎴 ${fortune.card}</div>
                            <div class="fortune-time">${fortune.time}</div>
                        </div>
                    `).join('');
                } else {
                    fortunesList.innerHTML = '<div class="no-fortunes">No fortunes printed yet</div>';
                }
            } catch (error) {
                console.error('Error updating status:', error);
                document.getElementById('statusText').textContent = 'Error';
            }
        }

        async function startSystem() {
            try {
                const response = await fetch('/api/start', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                updateStatus();
            } catch (error) {
                alert('Error starting system');
            }
        }

        async function stopSystem() {
            try {
                const response = await fetch('/api/stop', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                updateStatus();
            } catch (error) {
                alert('Error stopping system');
            }
        }

        async function restartSystem() {
            try {
                const response = await fetch('/api/restart', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                updateStatus();
            } catch (error) {
                alert('Error restarting system');
            }
        }

        // WiFi Configuration Functions
        async function loadWiFiStatus() {
            try {
                const response = await fetch('/api/config/wifi/status');
                const data = await response.json();
                const badge = document.getElementById('wifiStatus');

                if (data.connected) {
                    badge.innerHTML = `<span class="status-badge badge-connected">🟢 Connected</span><br><small>${data.ip_address}</small>`;
                } else {
                    badge.innerHTML = '<span class="status-badge badge-disconnected">🔴 Disconnected</span>';
                }
            } catch (error) {
                document.getElementById('wifiStatus').innerHTML = '<span class="status-badge badge-disconnected">Error loading status</span>';
            }
        }

        async function scanNetworks() {
            try {
                const response = await fetch('/api/config/wifi/networks');
                const data = await response.json();
                const networkList = document.getElementById('networkList');

                if (data.networks && data.networks.length > 0) {
                    networkList.innerHTML = data.networks.map(net => `
                        <div class="network-item" onclick="selectNetwork('${net.ssid}')">
                            <div class="network-name">📶 ${net.ssid}</div>
                            <div class="network-security">🔒 ${net.security}</div>
                        </div>
                    `).join('');
                } else {
                    networkList.innerHTML = '<div style="padding: 10px; text-align: center; color: #999;">No networks found</div>';
                }
            } catch (error) {
                document.getElementById('networkList').innerHTML = '<div style="padding: 10px; text-align: center; color: #f44336;">Error scanning networks</div>';
            }
        }

        function selectNetwork(ssid) {
            document.getElementById('wifiSSID').value = ssid;
            document.getElementById('wifiPassword').focus();
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('wifiPassword');
            const button = event.target;
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                button.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                button.textContent = '👁️';
            }
        }

        async function connectWiFi() {
            const ssid = document.getElementById('wifiSSID').value.trim();
            const password = document.getElementById('wifiPassword').value;

            if (!ssid) {
                showMessage('wifiMessage', 'Please select or enter a network name', 'error');
                return;
            }

            if (!password) {
                showMessage('wifiMessage', 'Please enter a password', 'error');
                return;
            }

            try {
                const response = await fetch('/api/config/wifi/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ssid: ssid, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('wifiMessage', data.message, 'success');
                    document.getElementById('wifiPassword').value = '';
                    setTimeout(loadWiFiStatus, 2000);
                } else {
                    showMessage('wifiMessage', data.error || 'Connection failed', 'error');
                }
            } catch (error) {
                showMessage('wifiMessage', 'Error connecting to WiFi: ' + error, 'error');
            }
        }

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.className = 'message ' + type;
            element.textContent = message;
            setTimeout(() => { element.textContent = ''; }, 5000);
        }

        // Initialize settings on load
        window.addEventListener('DOMContentLoaded', () => {
            loadWiFiStatus();
            scanNetworks();

            // Refresh WiFi status every 30 seconds
            setInterval(loadWiFiStatus, 30000);
        });
    </script>
</body>
</html>
